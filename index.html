<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bangla Converter | Ultra Premium</title>
    <link rel="stylesheet" href="style.css?v=20261046">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Advanced Animated Ambient Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="glass-overlay"></div>
    </div>

    <div class="app-wrapper">
        <!-- HEADER -->
        <header class="app-header fade-in-down">
            <div class="header-left">
                <div class="logo-icon-wrapper">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>Bangla Converter</h1>
                    <p class="subtitle">Next-Generation Unicode & Bijoy Translation</p>
                </div>
            </div>
            
            <div class="header-right">
                <button type="button" class="highlight-btn btn-fix" onclick="fixText()" title="Clean common Bengali text formatting issues">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"></path><path d="m14 7 3 3"></path></svg>
                    <span>Text Fix</span>
                </button>
                <button type="button" class="highlight-btn btn-clear" onclick="clearAll()" title="Clear all text fields">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                    <span>Clear All</span>
                </button>
            </div>
        </header>

        <main class="converter-board fade-in-up" id="converterApp">
            
            <!-- LEFT PANEL: UNICODE -->
            <div class="board-panel" id="unicodePanel">
                <div class="panel-header">
                    <div class="title-group">
                        <span class="lang-primary">Unicode</span>
                        <span class="lang-secondary">Avro</span>
                    </div>
                    <div class="header-actions">
                        <div class="phonetic-toggle-wrapper">
                            <span class="toggle-label">Auto Phonetic</span>
                            <label class="modern-switch">
                                <input type="checkbox" id="phoneticToggle" checked>
                                <span class="switch-track"></span>
                            </label>
                        </div>
                        <button type="button" class="btn-copy" id="copyUnicodeBtn" onclick="copyText('unicodeInput', this)" title="Copy Unicode Text">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="unicodeInput" class="custom-textarea font-unicode" spellcheck="false" placeholder="Type or paste Unicode text here..."></textarea>
                </div>
                <div class="panel-footer">
                    <span id="unicodeCount" class="char-badge">0 chars</span>
                    <button type="button" class="convert-btn btn-to-bijoy" onclick="convertUnicodeToBijoy()" title="Convert to Bijoy (Ctrl+Enter)">
                        <span>Convert to Bijoy</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>

            <div class="panel-divider"></div>

            <!-- RIGHT PANEL: BIJOY -->
            <div class="board-panel" id="bijoyPanel">
                <div class="panel-header">
                    <div class="title-group">
                        <span class="lang-primary">Bijoy</span>
                        <span class="lang-secondary">SutonnyMJ</span>
                    </div>
                    <div class="header-actions">
                        <button type="button" class="btn-copy" id="copyBijoyBtn" onclick="copyText('bijoyInput', this)" title="Copy Bijoy Text">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="bijoyInput" class="custom-textarea font-bijoy" spellcheck="false" placeholder="Type or paste Bijoy text here..."></textarea>
                </div>
                <div class="panel-footer right-aligned">
                    <span id="bijoyCount" class="char-badge">0 chars</span>
                    <button type="button" class="convert-btn btn-to-unicode" onclick="convertBijoyToUnicode()" title="Convert to Unicode (Ctrl+Enter)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
                        <span>Convert to Unicode</span>
                    </button>
                </div>
            </div>

        </main>
        
        <footer class="app-footer fade-in-up delay-2">
            <p>Developed by <a href="https://abdullahalsiam.bd" target="_blank" rel="noopener">Abdullah Al Siam</a></p>
        </footer>
    </div>

    <script src="js/avro.js"></script>
    <script src="js/engine.js?v=20260931"></script>

    <script>
        let lastEditedSide = 'unicode';

        const unicodeBox = document.getElementById('unicodeInput');
        const bijoyBox = document.getElementById('bijoyInput');
        const unicodeCountEl = document.getElementById('unicodeCount');
        const bijoyCountEl = document.getElementById('bijoyCount');

        function updateCounts() {
            const uBox = document.getElementById('unicodeInput');
            const bBox = document.getElementById('bijoyInput');
            const uCount = document.getElementById('unicodeCount');
            const bCount = document.getElementById('bijoyCount');
            
            if (uBox && uCount) uCount.textContent = uBox.value.length + ' chars';
            if (bBox && bCount) bCount.textContent = bBox.value.length + ' chars';
        }

        unicodeBox.addEventListener('input', () => { lastEditedSide = 'unicode'; updateCounts(); });
        bijoyBox.addEventListener('input', () => { lastEditedSide = 'bijoy'; updateCounts(); });
        unicodeBox.addEventListener('focus', () => { lastEditedSide = 'unicode'; });
        bijoyBox.addEventListener('focus', () => { lastEditedSide = 'bijoy'; });

        // Keyboard Shortcuts: Ctrl+Enter inside either box triggers conversion
        unicodeBox.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                convertUnicodeToBijoy();
            }
        });
        bijoyBox.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                convertBijoyToUnicode();
            }
        });

        function convertUnicodeToBijoy() {
            try {
                let unicodeText = unicodeBox.value;
                if (!unicodeText.trim()) return showToast('Please enter Unicode text first!');

                // Apply Phonetic translation if the toggle is checked
                const phoneticToggle = document.getElementById('phoneticToggle');
                if (phoneticToggle && phoneticToggle.checked && typeof AvroPhonetic !== 'undefined') {
                    unicodeText = AvroPhonetic.parse(unicodeText).bangla;
                    // Update the unicode box so the user sees the phonetically translated text
                    unicodeBox.value = unicodeText;
                }

                const bijoyText = BanglaLikhi.unicodeToBijoy(unicodeText);
                bijoyBox.value = bijoyText;
                updateCounts();
                highlightPanel('bijoyInput');
                showToast('Converted to Bijoy Successfully');
            } catch (err) {
                console.error('Unicode to Bijoy error:', err);
                showToast('Conversion failed. Please check input text.');
            }
        }

        function convertBijoyToUnicode() {
            try {
                const bijoyText = bijoyBox.value;
                if (!bijoyText.trim()) return showToast('Please enter Bijoy text first!');

                const unicodeText = BanglaLikhi.bijoyToUnicode(bijoyText);
                unicodeBox.value = unicodeText;
                updateCounts();
                highlightPanel('unicodeInput');
                showToast('Converted to Unicode Successfully');
            } catch (err) {
                console.error('Bijoy to Unicode error:', err);
                showToast('Conversion failed. Please check input text.');
            }
        }

                        function fixText() {
            try {
                let unicodeText = unicodeBox.value || '';
                let bijoyText = bijoyBox.value || '';

                if (!unicodeText.trim() && !bijoyText.trim()) {
                    showToast('কোনো টেক্সট পাওয়া যায়নি!');
                    return;
                }

                // Function to completely sanitize PDF line breaks (handles crlf too)
                const removePdfLineBreaks = (text) => {
                    if (!text) return '';
                    // Normalize to 

                    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                    // Split by paragraph (double newline)
                    return text.split(/\n\s*\n/).map(p => p.replace(/\n/g, ' ')).join('\n\n');
                };

                // Find the correct fixBanglaText function
                const fixBangla = (window.BanglaConverter && window.BanglaConverter.fixBanglaText) || 
                                  (window.BanglaLikhi && window.BanglaLikhi.fixText) || 
                                  (window.BanglaLikhi && window.BanglaLikhi.fixBanglaText) || 
                                  ((t) => t);

                if ((lastEditedSide === 'bijoy' && bijoyText.trim()) || (!unicodeText.trim() && bijoyText.trim())) {
                    let rawUni = BanglaLikhi.bijoyToUnicode(bijoyText) || '';
                    rawUni = removePdfLineBreaks(rawUni);
                    let cleanUni = fixBangla(rawUni) || '';
                    unicodeBox.value = cleanUni;
                    bijoyBox.value = BanglaLikhi.unicodeToBijoy(cleanUni) || '';
                } else {
                    let text = removePdfLineBreaks(unicodeText);
                    let cleanUni = fixBangla(text) || '';
                    unicodeBox.value = cleanUni;
                    bijoyBox.value = BanglaLikhi.unicodeToBijoy(cleanUni) || '';
                }
                
                showToast('Text formatting fixed ✨');
                updateCounts();
            } catch (err) {
                console.error('Fix Text error:', err);
                showToast('Error: ' + (err.message || 'Unknown error occurred'));
            }
        }

        function clearAll() {
            unicodeBox.value = '';
            bijoyBox.value = '';
            lastEditedSide = 'unicode';
            updateCounts();
            unicodeBox.focus();
            showToast('Cleared successfully');
        }

        function copyText(id, btnElement) {
            const el = document.getElementById(id);
            if (!el || !el.value) {
                return showToast('Nothing to copy!');
            }

            const text = el.value;
            const originalHTML = btnElement ? btnElement.innerHTML : null;

            function onCopySuccess() {
                if (btnElement) {
                    btnElement.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                    btnElement.style.borderColor = '#10b981';
                    setTimeout(() => {
                        btnElement.innerHTML = originalHTML;
                        btnElement.style.borderColor = '';
                    }, 1800);
                }
                showToast('Copied to clipboard!');
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(onCopySuccess).catch(() => {
                    fallbackCopy(el, onCopySuccess);
                });
            } else {
                fallbackCopy(el, onCopySuccess);
            }
        }

        function fallbackCopy(el, onSuccess) {
            try {
                el.select();
                el.setSelectionRange(0, 999999);
                const successful = document.execCommand('copy');
                if (successful) {
                    onSuccess();
                } else {
                    showToast('Failed to copy. Please copy manually.');
                }
            } catch (err) {
                console.error('Clipboard fallback error:', err);
                showToast('Failed to copy. Please copy manually.');
            }
        }

        let toastTimeout;
        function showToast(message) {
            const existing = document.querySelector('.toast-container');
            if (existing) existing.remove();
            clearTimeout(toastTimeout);

            let toast = document.createElement('div');
            toast.className = "toast-container show";
            toast.innerText = message;
            document.body.appendChild(toast);

            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 2600);
        }

        function highlightPanel(id) {
            const panel = document.getElementById(id).closest('.panel');
            if (panel) {
                panel.classList.add('highlight');
                setTimeout(() => panel.classList.remove('highlight'), 600);
            }
        }

        // Initialize count badges
        updateCounts();
    </script>
</body>
</html>
